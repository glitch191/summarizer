<!doctype html>
<!-- Shown in the sidebar until Summarize loads Gemini in it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Summarizer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8;
      --text: #1f2328;
      --text-muted: #57606a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --text: #e6e8eb;
        --text-muted: #a3aab3;
      }
    }
    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background: var(--bg);
      color: var(--text);
      font: 0.9375rem/1.5 "Segoe UI", system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <h1>YouTube Summarizer</h1>
  <p>Right-click a YouTube video, or a link to a video, and choose Summarize. Gemini opens here.</p>
</body>
</html>
